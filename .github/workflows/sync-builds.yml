name: Collect champion builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riot-build-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_KEY_TYPE: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check collector secrets
        shell: bash
        run: |
          if [[ -z "$RIOT_API_KEY" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Collector secrets missing. Configure RIOT_API_KEY, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
      - run: npx tsx scripts/check-build-stats.ts
      - run: npx tsx scripts/check-build-collector.ts
      - run: npx wrangler d1 migrations apply DB --remote
      # 상시 수집은 독립 Cron Worker에서 실행한다. 이 작업은 수동 보충용이다.
      - run: npm run builds:sync -- --remote --cycles 20
