name: Collect champion builds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: riot-build-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.BUILD_STATS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check collector secrets
        shell: bash
        run: |
          if [[ -z "$RIOT_API_KEY" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Collector secrets missing. Configure RIOT_API_KEY, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
      - run: npx tsx scripts/check-build-stats.ts
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npm run builds:sync -- --remote --matches 300 --players 40
